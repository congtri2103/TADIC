{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}?v=3">
  <title>Đăng nhập — TADIC CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #1258a4;
      --primary-dark: #0a3b72;
      --accent: #d6202f;
      --navy: #071f3d;
      --navy-light: #124f8d;
      --bg-light: #f7faff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Roboto',sans-serif;min-height:100vh;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);display:flex;align-items:center;justify-content:center}
    .login-wrap{width:100%;max-width:400px;padding:20px}
    .login-card{background:#fff;border-radius:12px;padding:36px;box-shadow:0 25px 60px rgba(0,0,0,.35)}
    .login-logo{text-align:center;margin-bottom:28px}
    .login-logo-image{display:block;width:170px;height:auto;margin:0 auto 8px}
    .login-logo-sub{font-size:.85rem;color:#666;margin-top:4px}
    h2{font-size:1.2rem;font-weight:700;color:var(--navy);margin-bottom:20px;font-family:'Hanken Grotesk',sans-serif;}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:.85rem;font-weight:500;color:var(--navy);margin-bottom:6px}
    .form-control{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:.9rem;font-family:inherit;color:#333;transition:border .2s;background:var(--bg-light);}
    .form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(18,88,164,.12);background:#fff;}
    .input-group{position:relative}
    .input-group i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#999;font-size:.85rem}
    .input-group .form-control{padding-left:36px}
    .btn-login{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:9999px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;margin-top:10px}
    .btn-login:hover{background:var(--primary-dark)}
    .errorlist{list-style:none;padding:10px 14px;background:#fee2e2;border:1px solid #fecaca;border-radius:8px;color:#991b1b;font-size:.85rem;margin-bottom:16px}
    .login-footer{text-align:center;margin-top:24px;font-size:.85rem;color:#666}
    .login-footer a{color:var(--navy);text-decoration:none;font-weight:500;}
    .login-footer a:hover{color:var(--accent)}
    .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}
    .login-wrap{position:relative;z-index:1}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img class="login-logo-image" src="{% static 'images/tadic-logo.png' %}" alt="Tadic">
        <div class="login-logo-sub">Hệ thống quản trị nội bộ</div>
      </div>
      <h2><i class="fa-solid fa-lock" style="color:var(--primary);margin-right:6px;font-size:.9rem;"></i>Đăng nhập</h2>
      {% if form.non_field_errors %}
      <ul class="errorlist">
        {% for error in form.non_field_errors %}
        <li><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</li>
        {% endfor %}
      </ul>
      {% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="id_username">Tên đăng nhập</label>
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input class="form-control" id="id_username" name="username" type="text" placeholder="username" autofocus autocomplete="username" required value="{{ form.username.value|default:'' }}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="id_password">Mật khẩu</label>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input class="form-control" id="id_password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
        </button>
      </form>
      <div class="login-footer">
        <a href="/"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>
      </div>
    </div>
  </div>
</body>
</html>
