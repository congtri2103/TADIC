databases:
  - name: tadic-db
    region: singapore
    plan: free

services:
  - type: web
    name: tadic-ai-demo
    runtime: python
    region: singapore
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,demo.tadic.vn,tadic.vn,www.tadic.vn

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://demo.tadic.vn,https://tadic.vn,https://www.tadic.vn

      - key: DATABASE_URL
        fromDatabase:
          name: tadic-db
          property: connectionString